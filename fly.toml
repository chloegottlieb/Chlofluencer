# Fly.io deployment. First time:
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly volumes create storytime_data --size 3 --region <region>
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32) SUPPORT_EMAIL=you@yourdomain.com MODERATOR_USERNAMES=yourname
#   fly deploy
app = "storytime-app" # change to your own unique name
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"

[[mounts]]
  source = "storytime_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite lives on one volume, so run exactly one always-on machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
