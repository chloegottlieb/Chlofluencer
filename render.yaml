# Render deployment (alternative to Fly.io): New → Blueprint → pick this repo.
services:
  - type: web
    name: storytime
    runtime: docker
    plan: starter # persistent disks need a paid plan
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPPORT_EMAIL
        sync: false
      - key: MODERATOR_USERNAMES
        sync: false
    disk:
      name: storytime-data
      mountPath: /data
      sizeGB: 5
